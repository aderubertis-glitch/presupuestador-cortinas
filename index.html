<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presupuestos">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
<title>Presupuestador</title>
</head>
<body>
<header>
  <div><h1>Presupuestador</h1><p>Precios sin IVA</p></div>
  <button id="newBudgetBtn">Nuevo presupuesto</button>
</header>

<main>
<section class="card">
  <h2>Nueva cortina / ítem</h2>

  <label for="tipoCortina">Tipo de cortina</label>
  <select id="tipoCortina"><option value="">Elegir tipo</option></select>

  <div id="componentes"></div>

  <div id="medidas" class="measure-box" hidden>
    <div id="anchoWrap" hidden>
      <label for="ancho">Ancho (m)</label>
      <input id="ancho" inputmode="decimal" placeholder="2,375">
    </div>
    <div id="largoWrap" hidden>
      <label for="largo">Largo (m)</label>
      <input id="largo" inputmode="decimal" placeholder="2,100">
    </div>
  </div>

  <label for="cantidad">Cantidad</label>
  <input id="cantidad" type="number" min="1" value="1">

  <div class="calc">
    <div id="itemBreakdown"></div>
    <div class="calc-subtotal"><span>Subtotal</span><b id="subtotal">$ 0</b></div>
    <div class="inline-discount">
      <label for="discountPercent">Descuento adicional (%)</label>
      <input id="discountPercent" type="number" min="0" max="100" step="0.1" value="0">
      <small class="hint">El 40% automático se aplica únicamente a los artículos que admiten descuento.</small>
    </div>
    <div class="discount-preview"><span id="additionalDiscountLabel">Descuento adicional (0%)</span><b id="additionalDiscount">-$ 0</b></div>
    <div class="total"><span>Total</span><b id="lineTotal">$ 0</b></div>
  </div>

  <button id="addBtn" class="primary">Agregar al presupuesto</button>
</section>

<section class="card">
  <div class="title"><h2>Presupuesto</h2><span id="itemCount">0 ítems</span></div>
  <div id="budgetLines"><p class="empty">Todavía no agregaste nada.</p></div>
  <div class="grand"><span>Total presupuesto</span><b id="grandTotal">$ 0</b></div>
  <button id="whatsappBtn" class="whatsapp">Enviar por WhatsApp</button>
</section>
</main>

<div id="pickerModal" class="picker-modal" hidden>
  <div class="picker-backdrop"></div>
  <section class="picker-sheet">
    <div class="picker-header"><h2 id="pickerTitle">Elegir</h2><button id="pickerClose" class="picker-close">Cerrar</button></div>
    <input id="pickerSearch" class="picker-search" type="search" placeholder="Buscar..." autocomplete="off">
    <div id="pickerResults" class="picker-list"></div>
  </section>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
