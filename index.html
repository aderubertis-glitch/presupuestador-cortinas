<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24445f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Presupuestos"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="styles.css"><title>Presupuestador</title></head><body><header><div><h1>Presupuestador</h1><p id="priceModeText">Precios con IVA</p></div><button id="newBudgetBtn">Nuevo</button></header><main><section class="card"><h2>Nueva cortina</h2><label>Mecanismo</label><input id="mecanismo" list="mecanismosList" placeholder="Buscar mecanismo"><datalist id="mecanismosList"></datalist><label>Tela</label><input id="tela" list="telasList" placeholder="Buscar tela"><datalist id="telasList"></datalist><div class="grid"><div><label>Ancho (m)</label><input id="ancho" inputmode="decimal" placeholder="2,40"></div><div><label>Largo (m)</label><input id="largo" inputmode="decimal" placeholder="2,10"></div></div><label>Cantidad</label><input id="cantidad" type="number" min="1" value="1"><details><summary>Agregar accesorio (opcional)</summary><label>Accesorio</label><input id="accesorio" list="accesoriosList" placeholder="Buscar accesorio"><datalist id="accesoriosList"></datalist><label>Cantidad de accesorio</label><input id="cantidadAccesorio" type="number" min="1" value="1"></details><div id="warning" class="warning" hidden></div><div class="calc"><div><span>Mecanismo</span><b id="mecanismoTotal">$ 0</b></div><div><span>Tela</span><b id="telaTotal">$ 0</b></div><div><span>Accesorio</span><b id="accesorioTotal">$ 0</b></div><div class="total"><span>Total cortina</span><b id="lineTotal">$ 0</b></div></div><button id="addBtn" class="primary">Agregar cortina</button><button id="copyLastBtn" class="secondary">Copiar última</button></section><section class="card"><div class="title"><h2>Presupuesto</h2><span id="itemCount">0 cortinas</span></div><div id="budgetLines"><p class="empty">Todavía no agregaste ninguna cortina.</p></div><div class="grand"><span>Total</span><b id="grandTotal">$ 0</b></div><button id="whatsappBtn" class="whatsapp">Enviar por WhatsApp</button></section><section class="card"><h2>Precio utilizado</h2><div class="toggle"><button id="withVatBtn" class="active">Con IVA</button><button id="withoutVatBtn">Sin IVA</button></div></section></main><script src="data.js"></script><script src="app.js"></script></body></html>
